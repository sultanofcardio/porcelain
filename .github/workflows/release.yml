# Publishes a release when a version tag is pushed:
#
#   1. npm version <patch|minor|major> -m "release: %s"
#      (moves the Unreleased section of CHANGELOG.md under the new version,
#       commits, and tags vX.Y.Z)
#   2. git push --follow-tags origin main
#
# An existing tag can also be released by hand from the Actions tab or with
#   gh workflow run release.yml --ref main -f tag=vX.Y.Z
#
# Needs a repository secret VSCE_PAT: an Azure DevOps personal access token
# with the "Marketplace (Manage)" scope for the sultanofcardio publisher.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            webview/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: webview

      - name: Tag must match package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "Tag $TAG does not match package.json version ($expected)" >&2
            exit 1
          fi

      - run: pnpm run build
      - run: pnpm run test:web
      - name: Extension-host tests
        run: xvfb-run -a pnpm run test

      - name: Package
        run: pnpm exec vsce package --no-dependencies --out "porcelain-${TAG#v}.vsix"

      - name: Release notes from CHANGELOG.md
        run: node scripts/changelog-notes.mjs "${TAG#v}" > release-notes.md

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce publish --packagePath "porcelain-${TAG#v}.vsix"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "Porcelain ${TAG#v}" \
            --notes-file release-notes.md \
            "porcelain-${TAG#v}.vsix"

      - name: Docs site changelog
        # The changelog page on gh-pages is rendered from CHANGELOG.md, never hand-edited.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin gh-pages
          git worktree add ../docs-site origin/gh-pages
          CHANGELOG="$PWD/CHANGELOG.md" python3 ../docs-site/_tools/build.py changelog
          cd ../docs-site
          if git diff --quiet -- changelog.html; then echo "changelog page unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: changelog page for ${TAG#v}" -- changelog.html
          git push origin HEAD:gh-pages
