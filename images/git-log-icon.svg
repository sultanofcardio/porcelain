<!--
  Git Log panel.

  The Porcelain P, reduced for a 24px glyph. VS Code applies these as a CSS
  mask, so only the alpha matters and the theme supplies the colour.

  The full logo marks the bowl's junction with a commit node. At this size the
  ring's counter closes against the bowl and the whole mark turns to mush, so
  the node is deliberately dropped here and the letterform carries it alone.
-->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
    <path d="M9.4 3.6a5.1 5.1 0 0 1 0 10.2"/>
    <path d="M9.4 3.6v16.8"/>
  </g>
</svg>
